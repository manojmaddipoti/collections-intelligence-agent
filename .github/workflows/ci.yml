name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Generate deterministic synthetic data
        run: python scripts/seed_data.py

      - name: Compile Python
        run: python -m compileall agents mcp_server scripts fast_api_app.py

      - name: Run unit and MCP integration tests
        run: python -m pytest -q

      - name: Validate evaluation configuration
        run: |
          python -c "import json, pathlib, yaml; json.load(open('tests/eval/collections.evalset.json')); json.load(open('tests/eval/adk_eval_config.json')); json.load(open('tests/eval/datasets/basic-dataset.json')); json.load(open('tests/eval/datasets/collections-scenarios.json')); yaml.safe_load(pathlib.Path('tests/eval/eval_config.yaml').read_text())"

      - name: Build container
        run: docker build -t collections-intelligence-agent:test .
